<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슈린슈 AI — 약관 검색</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FAF9F7; --panel:#FFFFFF; --line:#E7E5E0; --line-2:#F0EEE9;
    --ink:#1B1A18; --ink-2:#3E3C38; --muted:#8A857D; --faint:#ABA69D;
    --navy:#0F1E42; --navy-2:#2C55B8; --navy-soft:#EEF2FC;
    --warn-bg:#FEF6EC; --warn-line:#F0C48A; --warn-ink:#8A5A12;
    --shadow:0 1px 2px rgba(20,18,15,.05), 0 8px 24px -12px rgba(20,18,15,.12);
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:'Outfit','Noto Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  /* ── 상단 ── */
  header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:13px 20px;background:rgba(250,249,247,.9);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand img{height:26px;object-fit:contain}
  .brand b{font-size:14.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .brand span{font-size:10.5px;font-weight:700;color:#fff;background:var(--navy);
    padding:2px 7px;border-radius:20px;letter-spacing:.04em;flex-shrink:0}
  .hbtn{font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;
    cursor:pointer;padding:7px 10px;border-radius:9px;white-space:nowrap}
  .hbtn:hover{background:var(--line-2);color:var(--ink-2)}

  /* ── 잠금 화면 ── */
  #gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:380px;text-align:center}
  .gate-card .lock{width:52px;height:52px;margin:0 auto 20px;border-radius:16px;
    background:var(--navy);display:flex;align-items:center;justify-content:center}
  .gate-card h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:9px}
  .gate-card p{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:24px}
  .gate-row{display:flex;gap:8px}
  .gate-row input{flex:1;min-width:0;padding:13px 15px;font-size:15px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:13px;background:var(--panel);
    outline:none;letter-spacing:.22em;text-align:center;font-weight:700}
  .gate-row input:focus{border-color:var(--navy-2)}
  .gate-row button{padding:0 20px;font-size:14px;font-weight:700;font-family:inherit;
    color:#fff;background:var(--navy);border:0;border-radius:13px;cursor:pointer}
  .gate-row button:disabled{opacity:.45;cursor:default}
  .gate-err{margin-top:12px;font-size:12.5px;color:#B4392F;min-height:18px}

  /* ── 대화 ── */
  #app{flex:1;display:none;flex-direction:column;min-height:0}
  #scroll{flex:1;overflow-y:auto;padding:26px 20px 8px}
  .wrap{max-width:760px;margin:0 auto}

  .hello{text-align:center;padding:36px 0 30px}
  .hello img{width:60px;height:60px;object-fit:contain;margin-bottom:16px}
  .hello h2{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-bottom:10px}
  .hello p{font-size:13.5px;color:var(--muted);line-height:1.85}
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:22px}
  .chip{font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line);border-radius:22px;padding:8px 14px;cursor:pointer;
    transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--navy-2);background:var(--navy-soft)}

  .turn{display:flex;gap:11px;margin-bottom:22px;align-items:flex-start}
  .turn.me{justify-content:flex-end}
  .ava{width:29px;height:29px;border-radius:9px;flex-shrink:0;background:var(--navy);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ava img{width:22px;height:22px;object-fit:contain;filter:brightness(1.9)}
  .bub{max-width:100%;font-size:14.5px;line-height:1.85;word-break:keep-all}
  .turn.me .bub{background:var(--navy);color:#fff;padding:11px 15px;border-radius:15px 15px 4px 15px;
    max-width:80%;font-weight:500}
  .turn.ai .bub{color:var(--ink-2);padding-top:3px}
  .bub h3{font-size:14.5px;font-weight:800;color:var(--ink);margin:16px 0 7px}
  .bub h3:first-child{margin-top:0}
  .bub p{margin:0 0 10px}
  .bub ul,.bub ol{margin:0 0 10px;padding-left:19px}
  .bub li{margin-bottom:5px}
  .bub strong{font-weight:700;color:var(--ink)}
  .bub code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--navy-soft);color:var(--navy);padding:1.5px 6px;border-radius:5px}
  .bub table{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:13px;display:block;overflow-x:auto}
  .bub th,.bub td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .bub th{background:var(--line-2);font-weight:700;white-space:nowrap}
  .cite{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .cite b{font-size:10.5px;font-weight:700;color:var(--faint);align-self:center;margin-right:2px}
  .cite span{font-size:11px;font-weight:600;color:var(--navy);background:var(--navy-soft);
    border:1px solid #D3DDF3;border-radius:7px;padding:3px 8px}
  .think{display:flex;gap:5px;padding-top:9px}
  .think i{width:6px;height:6px;border-radius:50%;background:var(--faint);
    animation:blink 1.3s infinite}
  .think i:nth-child(2){animation-delay:.18s} .think i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28}30%{opacity:1}}
  .err{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);
    border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.7}

  /* ── 입력 ── */
  .dock{flex-shrink:0;padding:10px 20px 16px;background:linear-gradient(180deg,rgba(250,249,247,0) 0%,var(--bg) 34%)}
  .box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:19px;box-shadow:var(--shadow);padding:11px 12px 9px;
    transition:border-color .15s,box-shadow .15s}
  .box:focus-within{border-color:#C9CFDD;box-shadow:0 1px 2px rgba(20,18,15,.05),0 10px 30px -14px rgba(20,18,15,.2)}
  .box textarea{width:100%;border:0;outline:none;resize:none;background:transparent;
    font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);max-height:170px;
    padding:2px 4px 0}
  .box textarea::placeholder{color:var(--faint)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
  .row small{font-size:11px;color:var(--faint);line-height:1.5}
  .send{width:32px;height:32px;flex-shrink:0;border:0;border-radius:11px;cursor:pointer;
    background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;
    transition:opacity .15s}
  .send:disabled{opacity:.28;cursor:default}
  .foot{max-width:760px;margin:9px auto 0;font-size:11px;color:var(--faint);
    text-align:center;line-height:1.7}

  @media(max-width:640px){
    #scroll{padding:18px 14px 6px}
    .dock{padding:8px 14px 12px}
    .hello{padding:22px 0 20px}
    .hello h2{font-size:21px}
    .turn.me .bub{max-width:88%}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="surinsur.png" alt="">
    <b>슈린슈 AI</b>
    <span>약관 검색</span>
    <span id="test-badge" style="display:none;background:#B4392F">TEST</span>
  </div>
  <button class="hbtn" onclick="resetChat()">새 대화</button>
</header>

<!-- 잠금 -->
<section id="gate">
  <div class="gate-card">
    <div class="lock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>슈린슈 AI 약관 검색</h1>
    <p>해당 기능은 <strong>유료 기능</strong>이라 일부에게만 공개됩니다.<br>이용 코드를 입력해 주세요.</p>
    <form class="gate-row" onsubmit="return unlock(event)">
      <input id="code" type="password" inputmode="numeric" autocomplete="off"
             placeholder="••••" maxlength="12" aria-label="이용 코드">
      <button type="submit" id="gate-btn">입장</button>
    </form>
    <p class="gate-err" id="gate-err"></p>
  </div>
</section>

<!-- 대화 -->
<section id="app">
  <div id="scroll">
    <div class="wrap" id="thread">
      <div class="hello" id="hello">
        <img src="surinsur.png" alt="">
        <h2>무엇을 찾아드릴까요?</h2>
        <p>삼성화재 <strong>New내돈내삼(1640)</strong> 약관에서 찾아 답해드립니다.<br>
           담보·면책·감액·수술 등급 등을 물어보세요.</p>
        <div class="chips">
          <button class="chip" onclick="ask(this.textContent)">혈전제거술을 하면 어떤 수술비 담보가 나와?</button>
          <button class="chip" onclick="ask(this.textContent)">암 진단비 면책기간과 감액은?</button>
          <button class="chip" onclick="ask(this.textContent)">질병 1~8종 수술비 면책사항</button>
          <button class="chip" onclick="ask(this.textContent)">백내장 수술은 몇 종이야?</button>
        </div>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="box">
      <textarea id="q" rows="1" placeholder="약관에서 궁금한 것을 물어보세요"
                onkeydown="onKey(event)" oninput="grow(this)"></textarea>
      <div class="row">
        <small>Enter 전송 · Shift+Enter 줄바꿈</small>
        <button class="send" id="send" onclick="ask()" disabled aria-label="보내기">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="foot">
      약관 원문을 근거로 답하지만 <strong>참고용</strong>입니다. 보험금 지급은 청구 시 제출 서류와
      보험사 심사로 결정됩니다.
    </p>
  </div>
</section>

<script src="js/clause_index_data.js?v=20260901b"></script>
<script src="js/clause_search.js?v=20260901c"></script>
<script src="js/clause_gate.js?v=20260901a"></script>
<script src="js/clause_chat.js?v=20260901e"></script>
<script>if (TEST_MODE) document.getElementById('test-badge').style.display = '';</script>
</body>
</html>
