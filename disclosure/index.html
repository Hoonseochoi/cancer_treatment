<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고지도우미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="al-nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo">
        <img src="../surinsur.png" alt="슈인슈" class="nav-logo-img">
        <span>고지도우미</span>
      </a>
      <button id="reset-all-btn" class="nav-back" type="button" style="background:none;border:none;cursor:pointer;">전체 초기화</button>
      <a href="../index.html" class="nav-back">← 암보장분석기로 돌아가기</a>
    </div>
  </nav>

  <main id="al-content" class="landing-mode">
    <section class="hero" id="landing-hero">
      <img src="../surinsur.png" alt="슈린슈" class="hero-logo">
      <h1 class="hero-title">슈린슈 고지도우미</h1>
      <p class="hero-sub">병력을 형식 없이 적어주시면 표준알릴의무에 맞춰 정리해드려요</p>

      <div class="chat-input-wrap" id="chat-input-wrap">
        <label for="history-input" class="visually-hidden">병력 입력</label>
        <textarea id="history-input" class="chat-textarea" rows="1" placeholder="병력을 자유롭게 적어주세요. 예) 24년 1월 고혈압 진단, 현재 약 복용중"></textarea>
        <button id="parse-btn" type="button" class="chat-send-btn" aria-label="고지 정리하기">
          <svg class="chat-send-icon" width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 12V2M7 2L2.5 6.5M7 2L11.5 6.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="chat-send-spinner" width="15" height="15" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="26" stroke-dashoffset="18" />
          </svg>
        </button>
      </div>
      <p class="hero-disclaimer">자동분류 결과는 항상 "초안"이에요 · 최종 기재 전 직접 확인은 필수입니다</p>
    </section>

    <div id="results-area">
      <section class="section" id="step2">
        <span class="eyebrow">병력 확인 및 수정</span>
        <h2 class="stitle">자동 인식 결과예요</h2>
        <p class="slead">날짜·일수는 직접 확인해주세요.</p>
        <div id="history-list" class="hier-box"></div>
        <button id="add-row-btn" class="btn-secondary">+ 병력 추가</button>
      </section>

      <section class="section" id="step3">
        <span class="eyebrow">표준알릴의무 분류결과</span>
        <h2 class="stitle">문항별 분류결과</h2>
        <div id="classify-result"></div>
        <button id="copy-btn" class="btn-primary copy-sticky" type="button">결과 복사</button>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
